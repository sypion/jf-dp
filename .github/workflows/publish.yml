name: Publish

# Runs when a draft from release.yml is published, and again whenever its notes are edited, so the
# GitHub release notes are what Jellyfin's plugin catalog and the macOS app's update window show.
on:
  release:
    types: [released, edited]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Sparkle's feed skips pre-releases, so Jellyfin servers do too. Edits only matter when the notes changed.
    if: >-
      ${{ !github.event.release.draft && !github.event.release.prerelease
      && (github.event.action != 'edited' || github.event.changes.body) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      NOTES: ${{ github.event.release.body }}
    steps:
      - id: parse
        run: |
          if [[ ! "$TAG" =~ ^(macos-)?v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 for the plugin, or macos-v1.2.3 for the macOS app"
            exit 1
          fi
          echo "semver=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "plugin=$([ -z "${BASH_REMATCH[1]}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The manifest lives on the default branch, which may be ahead of the tagged commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download release files
        env:
          PLUGIN: ${{ steps.parse.outputs.plugin }}
        run: |
          if [ "$PLUGIN" = "true" ]; then pattern='jf-dp_[0-9]*.zip'; else pattern=appcast.xml; fi
          gh release download "$TAG" --dir "$RUNNER_TEMP/dist" --pattern "$pattern"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"

      - name: Update appcast.xml
        if: steps.parse.outputs.plugin == 'false'
        run: |
          python3 .github/scripts/update_appcast.py "$RUNNER_TEMP/dist/appcast.xml" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$RUNNER_TEMP/dist/appcast.xml" --clobber

      - name: Add to manifest.json
        if: steps.parse.outputs.plugin == 'true'
        run: >
          python3 .github/scripts/update_manifest.py
          --version "${{ steps.parse.outputs.semver }}"
          --dist "$RUNNER_TEMP/dist"
          --url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/"
          --changelog-file "$RUNNER_TEMP/notes.md"

      - name: Commit manifest.json
        if: steps.parse.outputs.plugin == 'true'
        run: |
          if git diff --quiet manifest.json; then
            echo "manifest.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish $TAG to plugin repository"
          git push

      - name: Keep the macOS release as latest
        if: steps.parse.outputs.plugin == 'true'
        run: |
          macos=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '[.[] | select(.tagName | startswith("macos-v"))][0].tagName // empty')
          if [ -n "$macos" ]; then
            gh release edit "$macos" --latest
          fi
